name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build ElyProxy.sln -c Release --nologo
      - name: Test
        run: dotnet test tests/ElyProxy.Tests/ElyProxy.Tests.csproj -c Release --no-build --nologo
      - name: Pester (release script validation)
        shell: pwsh
        run: |
          Import-Module Pester
          Invoke-Pester -Path tools -Output Detailed -CI
      - name: Publish and verify package layout
        shell: pwsh
        run: |
          $output = "publish-ci"
          dotnet publish ElyProxy.csproj -c Release -r win-x64 --self-contained false -o $output --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          $required = @(
            'ElyProxy.exe',
            'ElyProxy.dll',
            'updater\ElyProxy.Updater.exe',
            'helper\ElyProxy.Helper.exe',
            'sing-box\sing-box.exe',
            'Assets\RoscomVPN\ROSComVPN-DEFAULT.json'
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath (Join-Path $output $_)) })
          if ($missing.Count -gt 0) { throw "Missing publish artifacts: $($missing -join ', ')" }
          $ruleSets = @(Get-ChildItem -LiteralPath (Join-Path $output 'Assets\RoscomVPN') -Filter '*.srs' -File)
          if ($ruleSets.Count -ne 22) { throw "Expected 22 RoscomVPN rule sets, found $($ruleSets.Count)" }
          Write-Host "Publish layout verified: $($required.Count) required files, 22 rule sets"
